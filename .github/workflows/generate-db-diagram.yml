name: Generate DB Diagram

on:
  push:
    branches:
      - main
    paths:
      - 'backend/src/LaundryMapper/**'

jobs:
  generate-diagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run diagram generator
        run: |
          python3 .github/scripts/generate_db_diagram.py

      - name: Commit generated diagram
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/database-diagram.md
          git diff --cached --quiet || git commit -m 'chore: update database diagram'
          git push
